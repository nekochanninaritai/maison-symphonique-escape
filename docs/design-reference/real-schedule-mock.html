<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maison Symphonique Real Schedule Mock</title>
    <style>
      :root {
        color: #3d332c;
        background: #f7f3ea;
        font-family: "Times New Roman", "Yu Mincho", serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      .schedule-card {
        width: min(100%, 420px);
        padding: 30px 28px;
        border: 1px solid rgba(166, 120, 58, 0.42);
        border-radius: 8px;
        background:
          radial-gradient(circle at 88% 12%, rgba(80, 107, 90, 0.13), transparent 24%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.55), transparent 34%),
          #fffaf0;
        box-shadow: 0 18px 42px rgba(61, 51, 44, 0.14);
      }

      header {
        display: grid;
        gap: 5px;
        text-align: center;
        margin-bottom: 20px;
      }

      header span {
        color: #506b5a;
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 19px;
        letter-spacing: 0.08em;
      }

      ol {
        position: relative;
        display: grid;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      ol::before {
        content: "";
        position: absolute;
        left: 19px;
        top: 18px;
        bottom: 18px;
        width: 1px;
        background: rgba(166, 120, 58, 0.46);
      }

      li {
        position: relative;
        display: grid;
        grid-template-columns: 40px 74px 1fr;
        align-items: center;
        gap: 10px;
        min-height: 58px;
        border-top: 1px solid rgba(166, 120, 58, 0.2);
      }

      li:first-child {
        border-top: 0;
      }

      .icon {
        position: relative;
        z-index: 1;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(166, 120, 58, 0.58);
        border-radius: 50%;
        background: #fffdf7;
      }

      .icon::before {
        content: "";
        position: absolute;
        inset: 10px;
        border: 2px solid #506b5a;
      }

      .waiting::before {
        border-radius: 2px 2px 8px 8px;
      }

      .ceremony::before {
        border-radius: 50%;
      }

      .reception::before {
        border-radius: 2px 2px 10px 10px;
        transform: scaleX(0.7);
      }

      .finale::before {
        border: 0;
        clip-path: polygon(50% 0, 62% 36%, 100% 38%, 70% 60%, 80% 100%, 50% 76%, 20% 100%, 30% 60%, 0 38%, 38% 36%);
        background: #a6783a;
      }

      time {
        color: #2b2522;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      strong {
        display: block;
        letter-spacing: 0.06em;
      }

      small {
        display: block;
        margin-top: 2px;
        color: #506b5a;
        font-family: "Yu Gothic", sans-serif;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="schedule-card" aria-label="Design reference only. Not used in the game UI.">
      <header>
        <span>Maison Symphonique</span>
        <h1>TODAY'S SCHEDULE</h1>
      </header>
      <ol>
        <li>
          <span class="icon waiting" aria-hidden="true"></span>
          <time>11:00</time>
          <span><strong>WAITING</strong><small>待合室</small></span>
        </li>
        <li>
          <span class="icon ceremony" aria-hidden="true"></span>
          <time>12:00</time>
          <span><strong>CEREMONY</strong><small>挙式</small></span>
        </li>
        <li>
          <span class="icon reception" aria-hidden="true"></span>
          <time>13:00</time>
          <span><strong>RECEPTION</strong><small>披露宴</small></span>
        </li>
        <li>
          <span class="icon finale" aria-hidden="true"></span>
          <time>15:30</time>
          <span><strong>FINALE</strong><small>終演</small></span>
        </li>
      </ol>
    </main>
  </body>
</html>
